<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Photobooth Manager</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
      :root {
        color-scheme: light;
        --ink: #15202b;
        --muted: #687585;
        --line: #d9e1e8;
        --panel: #ffffff;
        --surface: #f4f7fa;
        --green: #087443;
        --blue: #174f8a;
        --yellow: #ffd447;
        --red: #bd2734;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background: var(--surface);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        border: 0;
        border-radius: 6px;
        padding: 10px 14px;
        color: #fff;
        background: var(--blue);
        cursor: pointer;
        font-weight: 700;
      }

      button.secondary {
        background: #566170;
      }

      button.warning {
        background: var(--red);
      }

      button.success {
        background: var(--green);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      input,
      select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 11px 12px;
        background: #fff;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 24px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(10px);
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 22px;
        line-height: 1.2;
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        gap: 20px;
        padding: 20px 24px 32px;
      }

      .auth {
        max-width: 380px;
        margin: 12vh auto 0;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .auth h2 {
        margin-bottom: 16px;
        font-size: 20px;
      }

      .auth label {
        display: grid;
        gap: 6px;
        margin-bottom: 14px;
        font-weight: 700;
      }

      .auth button {
        width: 100%;
        margin-top: 4px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .toolbar small,
      .muted {
        color: var(--muted);
      }

      .status-filter {
        display: grid;
        gap: 6px;
        margin-bottom: 16px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }

      .metric {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        background: var(--panel);
      }

      .metric strong {
        display: block;
        margin-top: 6px;
        font-size: 26px;
        line-height: 1;
      }

      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
        border-bottom: 1px solid var(--line);
      }

      .tab-button {
        border-radius: 6px 6px 0 0;
        color: var(--muted);
        background: transparent;
      }

      .tab-button.active {
        color: #fff;
        background: var(--blue);
      }

      .participants {
        display: grid;
        gap: 8px;
        margin-bottom: 22px;
      }

      .participant-row {
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) repeat(5, minmax(72px, 0.4fr));
        gap: 10px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        background: var(--panel);
        cursor: pointer;
      }

      .participant-row:hover,
      .participant-row:focus-visible {
        border-color: var(--blue);
        outline: none;
      }

      .participant-row.active {
        border-color: var(--blue);
        box-shadow: 0 0 0 2px rgb(23 79 138 / 14%);
      }

      .participant-row strong {
        display: block;
      }

      .participant-stat {
        text-align: right;
      }

      .participant-stat span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }

      .scope-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
      }

      .scope-toolbar small {
        width: 100%;
        text-align: right;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
      }

      .package,
      .queue {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        overflow: hidden;
      }

      .preview {
        display: grid;
        place-items: center;
        min-height: 260px;
        background: #eef3f7;
      }

      .preview img {
        width: 100%;
        height: 300px;
        object-fit: contain;
      }

      .package-body,
      .queue-body {
        display: grid;
        gap: 12px;
        padding: 14px;
      }

      .package-title {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        border-radius: 999px;
        padding: 3px 9px;
        color: #fff;
        background: #637083;
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
      }

      .status.completed,
      .status.printed {
        background: var(--green);
      }

      .status.error,
      .status.cancelled {
        background: var(--red);
      }

      .status.pending,
      .status.queued,
      .status.waiting-file {
        color: #162033;
        background: var(--yellow);
      }

      .stickers {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }

      .stickers button {
        display: block;
        border: 0;
        border-radius: 6px;
        padding: 0;
        background: #fff;
        cursor: zoom-in;
      }

      .stickers img {
        width: 100%;
        aspect-ratio: 1;
        object-fit: contain;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
      }

      .zoom-modal {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(6, 16, 30, 0.82);
      }

      .zoom-frame {
        position: relative;
        display: grid;
        place-items: center;
        width: min(88vw, 780px);
        height: min(88vh, 780px);
      }

      .zoom-frame img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        background: transparent;
      }

      .zoom-close {
        position: absolute;
        top: 0;
        right: 0;
        transform: translateY(-110%);
      }

      .zoom-resend {
        position: absolute;
        right: 0;
        bottom: 0;
        transform: translateY(120%);
      }

      .composition-modal {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(6, 16, 30, 0.82);
      }

      .composition-panel {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 16px;
        width: min(96vw, 980px);
        max-height: 94vh;
        border-radius: 8px;
        padding: 18px;
        background: var(--panel);
        overflow: auto;
      }

      .composition-panel-header,
      .composition-panel-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .composition-layout {
        display: grid;
        grid-template-columns: minmax(280px, 420px) minmax(240px, 1fr);
        gap: 18px;
        align-items: start;
      }

      .composition-stage {
        position: relative;
        width: min(100%, 420px);
        aspect-ratio: 1181 / 1772;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #101820;
        touch-action: none;
        user-select: none;
      }

      .composition-layer,
      .composition-subject,
      .composition-control {
        position: absolute;
      }

      .composition-layer {
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
        pointer-events: none;
      }

      .composition-subject {
        z-index: 2;
        overflow: hidden;
        pointer-events: none;
      }

      .composition-subject img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .composition-overlay {
        z-index: 3;
      }

      .composition-control {
        z-index: 4;
        border: 2px solid rgb(189 39 52 / 92%);
        background: rgb(255 255 255 / 10%);
        cursor: move;
        touch-action: none;
      }

      .composition-handle {
        position: absolute;
        z-index: 5;
        width: 15px;
        height: 15px;
        border: 2px solid #fff;
        border-radius: 50%;
        background: var(--red);
        box-shadow: 0 2px 8px rgb(21 24 32 / 28%);
      }

      .composition-handle[data-handle="n"],
      .composition-handle[data-handle="s"] {
        left: 50%;
        transform: translateX(-50%);
        cursor: ns-resize;
      }

      .composition-handle[data-handle="e"],
      .composition-handle[data-handle="w"] {
        top: 50%;
        transform: translateY(-50%);
        cursor: ew-resize;
      }

      .composition-handle[data-handle="n"] {
        top: -9px;
      }

      .composition-handle[data-handle="e"] {
        right: -9px;
      }

      .composition-handle[data-handle="s"] {
        bottom: -9px;
      }

      .composition-handle[data-handle="w"] {
        left: -9px;
      }

      .composition-handle[data-handle="ne"] {
        top: -9px;
        right: -9px;
        cursor: nesw-resize;
      }

      .composition-handle[data-handle="se"] {
        right: -9px;
        bottom: -9px;
        cursor: nwse-resize;
      }

      .composition-handle[data-handle="sw"] {
        bottom: -9px;
        left: -9px;
        cursor: nesw-resize;
      }

      .composition-handle[data-handle="nw"] {
        top: -9px;
        left: -9px;
        cursor: nwse-resize;
      }

      .composition-fields {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .composition-field {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
      }

      .composition-message {
        min-height: 20px;
        color: var(--muted);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      aside {
        position: sticky;
        top: 82px;
        align-self: start;
      }

      .queue-list {
        display: grid;
        gap: 12px;
      }

      .hidden {
        display: none !important;
      }

      .empty {
        padding: 24px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        color: var(--muted);
        background: #fff;
      }

      @media (max-width: 960px) {
        main {
          grid-template-columns: 1fr;
        }

        aside {
          position: static;
        }

        .participant-row {
          grid-template-columns: 1fr 1fr;
        }

        .participant-stat {
          text-align: left;
        }

        .composition-layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>AI Photobooth Manager</h1>
        <p class="muted" id="event-label"></p>
      </div>
      <button class="secondary hidden" id="logout-button" type="button">Sair</button>
    </header>

    <section class="auth" id="auth-panel">
      <h2>Entrar</h2>
      <label>
        Email
        <input id="email" type="email" autocomplete="email" />
      </label>
      <label>
        Senha
        <input id="password" type="password" autocomplete="current-password" />
      </label>
      <button id="login-button" type="button">Entrar</button>
      <p class="muted" id="auth-message"></p>
    </section>

    <main class="hidden" id="manager-panel">
      <section>
        <div class="metrics">
          <div class="metric">
            <span class="muted">Fotos geradas</span>
            <strong id="metric-photos-generated">0</strong>
          </div>
          <div class="metric">
            <span class="muted">Principais impressas</span>
            <strong id="metric-main-printed">0</strong>
          </div>
          <div class="metric">
            <span class="muted">Stickers impressos</span>
            <strong id="metric-stickers-printed">0</strong>
          </div>
          <div class="metric">
            <span class="muted">Limite por participante</span>
            <strong id="metric-print-limit">0</strong>
          </div>
          <div class="metric">
            <span class="muted">Tempo médio</span>
            <strong id="metric-generation-average">0s</strong>
          </div>
        </div>

        <div class="tabs" role="tablist" aria-label="Dados do manager">
          <button class="tab-button active" id="images-tab-button" type="button" data-tab="images">Imagens</button>
          <button class="tab-button" id="profiles-tab-button" type="button" data-tab="profiles">Participantes</button>
        </div>

        <div class="tab-panel" id="images-tab">
          <div class="toolbar">
            <h2>Imagens</h2>
            <div class="scope-toolbar">
              <small id="images-count">0 imagem(ns)</small>
              <button class="secondary hidden" id="clear-profile-filter" type="button">Ver todas</button>
            </div>
          </div>
          <div class="grid" id="images"></div>
        </div>

        <div class="tab-panel hidden" id="profiles-tab">
          <div class="toolbar">
            <h2>Participantes</h2>
            <small id="profiles-count">0 participante(s)</small>
          </div>
          <div class="participants" id="profiles"></div>
        </div>
      </section>

      <aside>
        <label class="status-filter">
          Status da fila
          <select id="print-status-filter">
            <option value="open">Em aberto</option>
            <option value="pending">Pendente</option>
            <option value="waiting-file">Aguardando arquivo</option>
            <option value="queued">Na pasta pending</option>
            <option value="print-error">Erro na principal</option>
            <option value="queue-error">Erro no sticker</option>
            <option value="printed">Impresso</option>
            <option value="cancelled">Cancelado</option>
            <option value="all">Todos</option>
          </select>
        </label>

        <div class="toolbar">
          <h2>Foto principal</h2>
          <small id="main-print-count">0 item(ns)</small>
        </div>
        <div class="queue-list" id="main-prints"></div>

        <div class="toolbar" style="margin-top: 20px;">
          <h2>Stickers</h2>
          <small id="sticker-print-count">0 item(ns)</small>
        </div>
        <div class="queue-list" id="sticker-prints"></div>
      </aside>
    </main>

    <div class="zoom-modal hidden" id="zoom-modal" role="dialog" aria-modal="true" aria-label="Sticker ampliado">
      <div class="zoom-frame">
        <button class="secondary zoom-close" id="zoom-close" type="button">Fechar</button>
        <img id="zoom-image" alt="" />
        <button class="success zoom-resend" id="zoom-resend" type="button">Reenviar WhatsApp</button>
      </div>
    </div>

    <div class="composition-modal hidden" id="composition-modal" role="dialog" aria-modal="true" aria-label="Ajustar imagem principal">
      <section class="composition-panel">
        <div class="composition-panel-header">
          <div>
            <h2 id="composition-title">Ajustar principal</h2>
            <p class="muted" id="composition-subtitle"></p>
          </div>
          <button class="secondary" id="composition-close" type="button">Fechar</button>
        </div>

        <div class="composition-layout">
          <div class="composition-stage" id="composition-stage">
            <img class="composition-layer" id="composition-background" alt="" aria-hidden="true" />
            <div class="composition-subject" id="composition-subject">
              <img id="composition-subject-image" alt="" />
            </div>
            <img class="composition-layer composition-overlay" id="composition-overlay" alt="" aria-hidden="true" />
            <div class="composition-control" id="composition-control" aria-label="Area da imagem principal">
              <span class="composition-handle" data-handle="n" aria-hidden="true"></span>
              <span class="composition-handle" data-handle="e" aria-hidden="true"></span>
              <span class="composition-handle" data-handle="s" aria-hidden="true"></span>
              <span class="composition-handle" data-handle="w" aria-hidden="true"></span>
              <span class="composition-handle" data-handle="ne" aria-hidden="true"></span>
              <span class="composition-handle" data-handle="se" aria-hidden="true"></span>
              <span class="composition-handle" data-handle="sw" aria-hidden="true"></span>
              <span class="composition-handle" data-handle="nw" aria-hidden="true"></span>
            </div>
          </div>

          <div>
            <div class="composition-fields">
              <label class="composition-field">
                Fundo
                <input id="composition-background-color" type="text" maxlength="16" />
              </label>
              <label class="composition-field">
                Ajuste
                <select id="composition-fit">
                  <option value="contain">contain</option>
                  <option value="cover">cover</option>
                  <option value="fill">fill</option>
                </select>
              </label>
              <label class="composition-field">
                X
                <input id="composition-left" type="number" step="1" />
              </label>
              <label class="composition-field">
                Y
                <input id="composition-top" type="number" step="1" />
              </label>
              <label class="composition-field">
                Largura
                <input id="composition-width" type="number" min="100" step="1" />
              </label>
              <label class="composition-field">
                Altura
                <input id="composition-height" type="number" min="100" step="1" />
              </label>
            </div>
          </div>
        </div>

        <div class="composition-panel-actions">
          <p class="composition-message" id="composition-message"></p>
          <div class="actions">
            <button class="secondary" id="composition-save-default" type="button">Salvar como padrão</button>
            <button class="success" id="composition-regenerate" type="button">Regerar principal</button>
          </div>
        </div>
      </section>
    </div>

    <script>
      const MAIN_PRINT_WIDTH = 1181;
      const MAIN_PRINT_HEIGHT = 1772;
      const MIN_SUBJECT_SIZE = 100;
      const SUBJECT_ASPECT_RATIO = 2 / 3;

      const state = {
        eventId: '',
        db: null,
        auth: null,
        eventUnsubscribe: null,
        imageUnsubscribe: null,
        profileUnsubscribe: null,
        printUnsubscribe: null,
        printRows: [],
        printStatusFilter: 'open',
        zoomSticker: null,
        selectedProfile: null,
        mainCompositionConfig: null,
        mainCompositionDefaults: {
          background: '#000d25',
          imageLeft: 90,
          imageTop: 82,
          imageWidth: 990,
          imageHeight: 1485,
          imageFit: 'contain',
        },
        compositionEditor: null,
        compositionDrag: null,
      };

      const authPanel = document.getElementById('auth-panel');
      const managerPanel = document.getElementById('manager-panel');
      const authMessage = document.getElementById('auth-message');
      const profilesEl = document.getElementById('profiles');
      const imagesEl = document.getElementById('images');
      const mainPrintsEl = document.getElementById('main-prints');
      const stickerPrintsEl = document.getElementById('sticker-prints');
      const profilesCount = document.getElementById('profiles-count');
      const imagesCount = document.getElementById('images-count');
      const clearProfileFilter = document.getElementById('clear-profile-filter');
      const mainPrintCount = document.getElementById('main-print-count');
      const stickerPrintCount = document.getElementById('sticker-print-count');
      const printStatusFilter = document.getElementById('print-status-filter');
      const metricPhotosGenerated = document.getElementById('metric-photos-generated');
      const metricMainPrinted = document.getElementById('metric-main-printed');
      const metricStickersPrinted = document.getElementById('metric-stickers-printed');
      const metricPrintLimit = document.getElementById('metric-print-limit');
      const metricGenerationAverage = document.getElementById('metric-generation-average');
      const zoomModal = document.getElementById('zoom-modal');
      const zoomImage = document.getElementById('zoom-image');
      const zoomClose = document.getElementById('zoom-close');
      const zoomResend = document.getElementById('zoom-resend');
      const logoutButton = document.getElementById('logout-button');
      const compositionModal = document.getElementById('composition-modal');
      const compositionTitle = document.getElementById('composition-title');
      const compositionSubtitle = document.getElementById('composition-subtitle');
      const compositionClose = document.getElementById('composition-close');
      const compositionStage = document.getElementById('composition-stage');
      const compositionBackground = document.getElementById('composition-background');
      const compositionOverlay = document.getElementById('composition-overlay');
      const compositionSubject = document.getElementById('composition-subject');
      const compositionSubjectImage = document.getElementById('composition-subject-image');
      const compositionControl = document.getElementById('composition-control');
      const compositionMessage = document.getElementById('composition-message');
      const compositionRegenerate = document.getElementById('composition-regenerate');
      const compositionSaveDefault = document.getElementById('composition-save-default');
      const compositionInputs = {
        background: document.getElementById('composition-background-color'),
        imageLeft: document.getElementById('composition-left'),
        imageTop: document.getElementById('composition-top'),
        imageWidth: document.getElementById('composition-width'),
        imageHeight: document.getElementById('composition-height'),
        imageFit: document.getElementById('composition-fit'),
      };

      boot();

      async function boot() {
        const configResponse = await fetch('/api/photobooth/manager/config');
        const config = await configResponse.json();

        state.eventId = config.eventId;
        applyMainCompositionConfig(config.mainComposition);
        document.getElementById('event-label').textContent = config.firestoreRoot;
        if (config.printLimitPerProfile !== null && config.printLimitPerProfile !== undefined) {
          metricPrintLimit.textContent = formatNumber(config.printLimitPerProfile);
        }

        if (!config.firebaseConfig || !config.firebaseConfig.apiKey) {
          authMessage.textContent = 'Firebase publico nao configurado no ambiente.';
          return;
        }

        firebase.initializeApp(config.firebaseConfig);
        state.db = firebase.firestore();
        state.auth = firebase.auth();

        document.getElementById('login-button').addEventListener('click', login);
        logoutButton.addEventListener('click', () => state.auth.signOut());
        printStatusFilter.addEventListener('change', () => {
          state.printStatusFilter = printStatusFilter.value;
          renderPrintLists();
        });
        clearProfileFilter.addEventListener('click', clearSelectedProfile);
        zoomClose.addEventListener('click', closeStickerZoom);
        zoomResend.addEventListener('click', resendZoomSticker);
        compositionClose.addEventListener('click', closeCompositionEditor);
        compositionRegenerate.addEventListener('click', regenerateCompositionImage);
        compositionSaveDefault.addEventListener('click', saveCompositionAsDefault);
        compositionControl.addEventListener('pointerdown', startCompositionDrag);
        Object.entries(compositionInputs).forEach(([name, input]) => {
          input.addEventListener('input', () => syncCompositionFromInputs(name));
        });
        window.addEventListener('resize', () => {
          if (state.compositionEditor) {
            renderCompositionBox(readCompositionInputs());
          }
        });
        zoomModal.addEventListener('click', (event) => {
          if (event.target === zoomModal) {
            closeStickerZoom();
          }
        });
        compositionModal.addEventListener('click', (event) => {
          if (event.target === compositionModal) {
            closeCompositionEditor();
          }
        });
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape' && !zoomModal.classList.contains('hidden')) {
            closeStickerZoom();
          }
          if (event.key === 'Escape' && !compositionModal.classList.contains('hidden')) {
            closeCompositionEditor();
          }
        });
        document.querySelectorAll('[data-tab]').forEach((button) => {
          button.addEventListener('click', () => setActiveTab(button.dataset.tab));
        });
        document.getElementById('password').addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            login();
          }
        });

        state.auth.onAuthStateChanged((user) => {
          if (user) {
            authPanel.classList.add('hidden');
            managerPanel.classList.remove('hidden');
            logoutButton.classList.remove('hidden');
            listenEventStats();
            listenProfiles();
            listenImages();
            listenPrints();
          } else {
            authPanel.classList.remove('hidden');
            managerPanel.classList.add('hidden');
            logoutButton.classList.add('hidden');
            stopListeners();
          }
        });
      }

      async function login() {
        authMessage.textContent = '';

        try {
          await state.auth.signInWithEmailAndPassword(
            document.getElementById('email').value,
            document.getElementById('password').value,
          );
        } catch (error) {
          authMessage.textContent = error.message;
        }
      }

      function setActiveTab(tab) {
        const next = tab === 'profiles' ? 'profiles' : 'images';

        document.querySelectorAll('[data-tab]').forEach((button) => {
          button.classList.toggle('active', button.dataset.tab === next);
        });
        document.getElementById('images-tab').classList.toggle('hidden', next !== 'images');
        document.getElementById('profiles-tab').classList.toggle('hidden', next !== 'profiles');
      }

      function listenEventStats() {
        if (state.eventUnsubscribe) {
          state.eventUnsubscribe();
        }

        state.eventUnsubscribe = state.db
          .collection('events')
          .doc(state.eventId)
          .onSnapshot((doc) => {
            const item = doc.data() || {};
            const stats = item.stats || {};
            const prints = stats.prints || {};
            const generation = stats.generation || {};

            metricPhotosGenerated.textContent = formatNumber(stats.photosGenerated);
            metricMainPrinted.textContent = formatNumber(prints.mainPrinted);
            metricStickersPrinted.textContent = formatNumber(prints.stickersPrinted);
            metricPrintLimit.textContent = item.printLimitPerProfile === undefined
              ? '-'
              : formatNumber(item.printLimitPerProfile);
            metricGenerationAverage.textContent = formatAverageDuration(generation);

            if (item.mainComposition) {
              state.mainCompositionDefaults = normalizeComposition(item.mainComposition);
            }
          });
      }

      function listenProfiles() {
        if (state.profileUnsubscribe) {
          state.profileUnsubscribe();
        }

        state.profileUnsubscribe = state.db
          .collection('events')
          .doc(state.eventId)
          .collection('profiles')
          .orderBy('updatedAt', 'desc')
          .limit(120)
          .onSnapshot((snapshot) => {
            profilesCount.textContent = `${snapshot.size} participante(s)`;
            profilesEl.innerHTML = '';

            if (!snapshot.size) {
              profilesEl.innerHTML = '<div class="empty">Nenhum participante encontrado.</div>';
              return;
            }

            snapshot.forEach((doc) => profilesEl.appendChild(renderProfile(doc.id, doc.data())));
          }, (error) => {
            profilesEl.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
          });
      }

      function listenImages() {
        if (state.imageUnsubscribe) {
          state.imageUnsubscribe();
        }

        let query = state.db
          .collection('events')
          .doc(state.eventId)
          .collection('images');

        if (state.selectedProfile) {
          query = query.where('profileId', '==', state.selectedProfile.id);
        } else {
          query = query.orderBy('createdAt', 'desc').limit(100);
        }

        state.imageUnsubscribe = query.onSnapshot((snapshot) => {
          const rows = [];
          snapshot.forEach((doc) => rows.push({ id: doc.id, data: doc.data() || {} }));

          if (state.selectedProfile) {
            rows.sort((a, b) => timestampToMillis(b.data.createdAt) - timestampToMillis(a.data.createdAt));
          }

          renderImages(rows);
        }, (error) => {
          imagesEl.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
        });
      }

      function renderImages(rows) {
        const scopedName = state.selectedProfile ? state.selectedProfile.name : '';
        const scopedPhone = state.selectedProfile && state.selectedProfile.phone
          ? ` ${maskPhone(state.selectedProfile.phone)}`
          : '';
        imagesCount.textContent = state.selectedProfile
          ? `${rows.length} imagem(ns) de ${scopedName}${scopedPhone}`
          : `${rows.length} imagem(ns)`;
        clearProfileFilter.classList.toggle('hidden', !state.selectedProfile);
        imagesEl.innerHTML = '';

        if (!rows.length) {
          imagesEl.innerHTML = state.selectedProfile
            ? '<div class="empty">Nenhuma imagem encontrada para este participante.</div>'
            : '<div class="empty">Nenhuma imagem encontrada.</div>';
          return;
        }

        rows.forEach((row) => imagesEl.appendChild(renderImage(row.id, row.data)));
      }

      function listenPrints() {
        if (state.printUnsubscribe) {
          state.printUnsubscribe();
        }

        state.printUnsubscribe = state.db
          .collection('events')
          .doc(state.eventId)
          .collection('prints')
          .orderBy('requestedAt', 'desc')
          .limit(120)
          .onSnapshot((snapshot) => {
            state.printRows = [];
            snapshot.forEach((doc) => {
              const item = doc.data();
              state.printRows.push({ id: doc.id, data: item });
            });

            renderPrintLists();
          }, (error) => {
            mainPrintsEl.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
            stickerPrintsEl.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
          });
      }

      function renderPrintLists() {
        const filteredRows = state.printRows.filter((row) => matchesPrintStatus(row.data));
        const totalMain = state.printRows.filter((row) => row.data.type === 'main').length;
        const totalStickers = state.printRows.filter((row) => row.data.type !== 'main').length;
        const mainDocs = filteredRows.filter((row) => row.data.type === 'main');
        const stickerDocs = filteredRows.filter((row) => row.data.type !== 'main');

        mainPrintCount.textContent = `${mainDocs.length}/${totalMain} item(ns)`;
        stickerPrintCount.textContent = `${stickerDocs.length}/${totalStickers} item(ns)`;
        mainPrintsEl.innerHTML = '';
        stickerPrintsEl.innerHTML = '';

        if (!mainDocs.length) {
          mainPrintsEl.innerHTML = '<div class="empty">Nenhuma foto principal neste status.</div>';
        } else {
          mainDocs.forEach((row) => mainPrintsEl.appendChild(renderPrintItem(row.id, row.data)));
        }

        if (!stickerDocs.length) {
          stickerPrintsEl.innerHTML = '<div class="empty">Nenhum sticker neste status.</div>';
        } else {
          stickerDocs.forEach((row) => stickerPrintsEl.appendChild(renderPrintItem(row.id, row.data)));
        }
      }

      function matchesPrintStatus(item) {
        const filter = state.printStatusFilter || 'open';
        const status = item.status || 'pending';

        if (filter === 'all') {
          return true;
        }

        if (filter === 'open') {
          return ['pending', 'waiting-file', 'queued'].includes(status);
        }

        return status === filter;
      }

      function renderImage(imageId, item) {
        const article = document.createElement('article');
        article.className = 'package';
        const mainUrl = getMainImageUrl(item);
        const subjectUrl = getMainSubjectUrl(item);
        const stickerItems = getStickerItems(item);
        const participantName = item.profile?.profileName || 'Participante';
        const phone = item.profile?.phoneNumber || '';
        const generation = item.generation || {};
        const durationLabel = generation.lastDurationMs
          ? `Geracao: ${formatDuration(generation.lastDurationMs)}`
          : '';
        const receivedLabel = generation.lastReceivedToCompletedMs
          ? `recebida ate pronta: ${formatDuration(generation.lastReceivedToCompletedMs)}`
          : '';

        article.innerHTML = `
          <div class="preview">
            ${mainUrl ? `<img src="${mainUrl}" alt="${escapeHtml(participantName)}" loading="lazy" />` : '<span class="muted">sem imagem principal</span>'}
          </div>
          <div class="package-body">
            <div class="package-title">
              <div>
                <h3>${escapeHtml(participantName)}</h3>
                <p class="muted">${escapeHtml(maskPhone(phone))}</p>
              </div>
              <span class="status ${escapeAttr(item.status || 'pending')}">${escapeHtml(item.status || 'pending')}</span>
            </div>
            ${durationLabel ? `<p class="muted">${escapeHtml([durationLabel, receivedLabel].filter(Boolean).join(' · '))}</p>` : ''}
            <div class="stickers">
              ${stickerItems.map((sticker) => `
                <button
                  type="button"
                  data-zoom-src="${escapeHtml(sticker.url)}"
                  data-zoom-image-id="${escapeHtml(imageId)}"
                  data-zoom-output-id="${escapeHtml(sticker.outputId)}"
                >
                  <img src="${escapeHtml(sticker.url)}" alt="${escapeHtml(sticker.title)}" loading="lazy" />
                </button>
              `).join('')}
            </div>
            <div class="actions">
              <button type="button" class="secondary" data-action="adjust-main" ${subjectUrl ? '' : 'disabled'}>Ajustar principal</button>
              <button type="button" data-action="regenerate">Regerar</button>
              <button type="button" class="success" data-action="print-stickers">Imprimir stickers</button>
              <button type="button" class="secondary" data-action="print-main">Reimprimir principal</button>
            </div>
          </div>
        `;

        article.querySelectorAll('[data-zoom-src]').forEach((button) => {
          button.addEventListener('click', () => openStickerZoom({
            url: button.dataset.zoomSrc,
            imageId: button.dataset.zoomImageId,
            outputId: button.dataset.zoomOutputId,
          }));
        });
        const adjustButton = article.querySelector('[data-action="adjust-main"]');
        if (adjustButton && subjectUrl) {
          adjustButton.addEventListener('click', () => openCompositionEditor(imageId, item));
        }
        article.querySelector('[data-action="regenerate"]').addEventListener('click', () => regenerateImage(imageId));
        article.querySelector('[data-action="print-stickers"]').addEventListener('click', () => requestPrint(imageId, 'stickers'));
        article.querySelector('[data-action="print-main"]').addEventListener('click', () => requestPrint(imageId, 'main'));

        return article;
      }

      function renderProfile(profileId, item) {
        const article = document.createElement('article');
        article.className = 'participant-row';
        article.dataset.profileId = profileId;
        article.tabIndex = 0;
        article.setAttribute('role', 'button');
        const stats = item.stats || {};
        const prints = stats.prints || {};
        const generation = stats.generation || {};
        const name = item.profileName || item.whatsappProfile?.profileName || 'Participante';
        const unlimited = item.unlimited === true ? ' · ilimitado' : '';
        const isSelected = state.selectedProfile && state.selectedProfile.id === profileId;

        if (isSelected) {
          article.classList.add('active');
        }

        article.innerHTML = `
          <div>
            <strong>${escapeHtml(name)}</strong>
            <span class="muted">${escapeHtml(maskPhone(item.phoneNumber || profileId))}${escapeHtml(unlimited)}</span>
          </div>
          <div class="participant-stat">
            ${formatNumber(stats.imagesSubmitted)}
            <span>recebidas</span>
          </div>
          <div class="participant-stat">
            ${formatNumber(stats.photosGenerated)}
            <span>geradas</span>
          </div>
          <div class="participant-stat">
            ${formatAverageDuration(generation)}
            <span>tempo medio</span>
          </div>
          <div class="participant-stat">
            ${formatNumber(prints.mainPrinted)}
            <span>principal</span>
          </div>
          <div class="participant-stat">
            ${formatNumber(prints.stickersPrinted)}
            <span>stickers</span>
          </div>
        `;
        article.addEventListener('click', () => selectProfileImages(profileId, name, item.phoneNumber || profileId));
        article.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            selectProfileImages(profileId, name, item.phoneNumber || profileId);
          }
        });

        return article;
      }

      function selectProfileImages(profileId, name, phone) {
        state.selectedProfile = {
          id: profileId,
          name: name || 'Participante',
          phone: phone || '',
        };
        setActiveTab('images');
        listenImages();
        refreshProfileSelection();
      }

      function clearSelectedProfile() {
        state.selectedProfile = null;
        listenImages();
        refreshProfileSelection();
      }

      function refreshProfileSelection() {
        profilesEl.querySelectorAll('.participant-row').forEach((row) => {
          row.classList.remove('active');
        });

        if (!state.selectedProfile) {
          return;
        }

        profilesEl.querySelectorAll('.participant-row').forEach((row) => {
          row.classList.toggle('active', row.dataset.profileId === state.selectedProfile.id);
        });
      }

      function renderPrintItem(printId, item) {
        const article = document.createElement('article');
        article.className = 'queue';
        const profile = item.profile || {};

        article.innerHTML = `
          <div class="queue-body">
            <div class="package-title">
              <div>
                <h3>${escapeHtml(profile.profileName || printId)}</h3>
                <p class="muted">${escapeHtml(maskPhone(profile.phoneNumber || ''))}</p>
              </div>
              <span class="status ${escapeAttr(item.status || 'pending')}">${escapeHtml(item.status || 'pending')}</span>
            </div>
            <p class="muted">${escapeHtml(item.type || 'stickers')} · ${escapeHtml(item.pendingFilename || item.imageId || 'aguardando arquivo')}</p>
            <div class="actions">
              <button type="button" class="secondary" data-status="pending">Pendente</button>
              <button type="button" class="success" data-status="printed">Impresso</button>
              <button type="button" class="warning" data-status="cancelled">Cancelar</button>
            </div>
          </div>
        `;

        article.querySelectorAll('[data-status]').forEach((button) => {
          button.addEventListener('click', () => updatePrintStatus(printId, button.dataset.status));
        });

        return article;
      }

      async function requestPrint(imageId, type) {
        await apiPost('/api/photobooth/manager/prints', { imageId, type });
      }

      async function regenerateImage(imageId) {
        await apiPost(`/api/photobooth/manager/images/${encodeURIComponent(imageId)}/regenerate`, {});
      }

      async function updatePrintStatus(printId, status) {
        await apiPost(`/api/photobooth/manager/prints/${encodeURIComponent(printId)}/status`, { status });
      }

      function applyMainCompositionConfig(config) {
        state.mainCompositionConfig = config || state.mainCompositionConfig || {};

        if (config && config.defaults) {
          state.mainCompositionDefaults = normalizeComposition(config.defaults);
        }

        const backgroundUrl = state.mainCompositionConfig?.backgroundImageUrl || '/api/photobooth/main-card-background';
        const overlayUrl = state.mainCompositionConfig?.overlayImageUrl || '/api/photobooth/main-card-overlay';
        compositionBackground.src = `${backgroundUrl}?t=${Date.now()}`;
        compositionOverlay.src = `${overlayUrl}?t=${Date.now()}`;
      }

      function openCompositionEditor(imageId, item) {
        const subjectUrl = getMainSubjectUrl(item);

        if (!subjectUrl) {
          alert('Esta imagem ainda nao possui subject-png para reposicionamento.');
          return;
        }

        const participantName = item.profile?.profileName || 'Participante';
        const layout = normalizeComposition(getImageComposition(item));

        state.compositionEditor = {
          imageId,
          item,
        };
        compositionTitle.textContent = 'Ajustar principal';
        compositionSubtitle.textContent = `${participantName} · ${imageId}`;
        compositionSubjectImage.src = subjectUrl;
        compositionMessage.textContent = '';
        compositionRegenerate.disabled = false;
        compositionSaveDefault.disabled = false;
        compositionModal.classList.remove('hidden');
        applyCompositionToInputs(layout);
        requestAnimationFrame(() => renderCompositionBox(readCompositionInputs()));
      }

      function closeCompositionEditor() {
        compositionModal.classList.add('hidden');
        compositionSubjectImage.removeAttribute('src');
        compositionMessage.textContent = '';
        state.compositionEditor = null;
        state.compositionDrag = null;
        window.removeEventListener('pointermove', moveCompositionDrag);
        window.removeEventListener('pointerup', stopCompositionDrag);
      }

      async function regenerateCompositionImage() {
        if (!state.compositionEditor) {
          return;
        }

        const layout = readCompositionInputs();
        compositionRegenerate.disabled = true;
        compositionMessage.textContent = 'Recompondo imagem principal.';

        try {
          await apiPost(
            `/api/photobooth/manager/images/${encodeURIComponent(state.compositionEditor.imageId)}/main-composition/regenerate`,
            { composition: layout },
          );
          compositionMessage.textContent = 'Principal recomposta e enviada por WhatsApp.';
        } catch (error) {
          compositionMessage.textContent = error.message || 'Falha ao recompor principal.';
        } finally {
          compositionRegenerate.disabled = false;
        }
      }

      async function saveCompositionAsDefault() {
        const layout = readCompositionInputs();
        compositionSaveDefault.disabled = true;
        compositionMessage.textContent = 'Salvando ajuste como padrao.';

        try {
          const response = await apiPost('/api/photobooth/manager/main-composition', layout);
          applyMainCompositionConfig(response);
          compositionMessage.textContent = 'Ajuste salvo no Firestore para as proximas imagens.';
        } catch (error) {
          compositionMessage.textContent = error.message || 'Falha ao salvar padrao.';
        } finally {
          compositionSaveDefault.disabled = false;
        }
      }

      function applyCompositionToInputs(layout) {
        const normalized = normalizeComposition(layout);

        compositionInputs.background.value = normalized.background;
        compositionInputs.imageLeft.value = normalized.imageLeft;
        compositionInputs.imageTop.value = normalized.imageTop;
        compositionInputs.imageWidth.value = normalized.imageWidth;
        compositionInputs.imageHeight.value = normalized.imageHeight;
        compositionInputs.imageFit.value = normalized.imageFit;
        renderCompositionBox(normalized);
      }

      function syncCompositionFromInputs(inputName = '') {
        applyCompositionToInputs(normalizeComposition({
          background: compositionInputs.background.value,
          imageLeft: compositionInputs.imageLeft.value,
          imageTop: compositionInputs.imageTop.value,
          imageWidth: compositionInputs.imageWidth.value,
          imageHeight: compositionInputs.imageHeight.value,
          imageFit: compositionInputs.imageFit.value,
        }, inputName === 'imageHeight' ? 'height' : 'width'));
      }

      function readCompositionInputs() {
        return normalizeComposition({
          background: compositionInputs.background.value,
          imageLeft: compositionInputs.imageLeft.value,
          imageTop: compositionInputs.imageTop.value,
          imageWidth: compositionInputs.imageWidth.value,
          imageHeight: compositionInputs.imageHeight.value,
          imageFit: compositionInputs.imageFit.value,
        });
      }

      function normalizeComposition(value = {}, basis = 'width') {
        let imageWidth = readNumber(value.imageWidth, state.mainCompositionDefaults.imageWidth || 990);
        let imageHeight = readNumber(value.imageHeight, state.mainCompositionDefaults.imageHeight || 1485);

        if (basis === 'height') {
          imageHeight = clamp(imageHeight, Math.round(MIN_SUBJECT_SIZE / SUBJECT_ASPECT_RATIO), MAIN_PRINT_HEIGHT);
          imageWidth = Math.round(imageHeight * SUBJECT_ASPECT_RATIO);
        } else {
          imageWidth = clamp(imageWidth, MIN_SUBJECT_SIZE, MAIN_PRINT_WIDTH);
          imageHeight = Math.round(imageWidth / SUBJECT_ASPECT_RATIO);
        }

        if (imageHeight > MAIN_PRINT_HEIGHT) {
          imageHeight = MAIN_PRINT_HEIGHT;
          imageWidth = Math.round(imageHeight * SUBJECT_ASPECT_RATIO);
        }

        if (imageWidth > MAIN_PRINT_WIDTH) {
          imageWidth = MAIN_PRINT_WIDTH;
          imageHeight = Math.round(imageWidth / SUBJECT_ASPECT_RATIO);
        }

        const imageLeft = clamp(readNumber(value.imageLeft, state.mainCompositionDefaults.imageLeft || 90), 0, MAIN_PRINT_WIDTH - imageWidth);
        const imageTop = clamp(readNumber(value.imageTop, state.mainCompositionDefaults.imageTop || 82), 0, MAIN_PRINT_HEIGHT - imageHeight);
        const imageFit = ['contain', 'cover', 'fill'].includes(value.imageFit) ? value.imageFit : 'contain';

        return {
          background: value.background || state.mainCompositionDefaults.background || '#000d25',
          imageLeft,
          imageTop,
          imageWidth,
          imageHeight,
          imageFit,
        };
      }

      function renderCompositionBox(layout) {
        const scale = getCompositionScale();
        compositionStage.style.backgroundColor = layout.background;

        [compositionSubject, compositionControl].forEach((element) => {
          element.style.left = `${layout.imageLeft * scale.x}px`;
          element.style.top = `${layout.imageTop * scale.y}px`;
          element.style.width = `${layout.imageWidth * scale.x}px`;
          element.style.height = `${layout.imageHeight * scale.y}px`;
        });

        compositionSubjectImage.style.objectFit = layout.imageFit === 'fill' ? 'fill' : layout.imageFit;
      }

      function getCompositionScale() {
        const rect = compositionStage.getBoundingClientRect();
        const width = rect.width || 420;
        const height = rect.height || Math.round(width * MAIN_PRINT_HEIGHT / MAIN_PRINT_WIDTH);

        return {
          x: width / MAIN_PRINT_WIDTH,
          y: height / MAIN_PRINT_HEIGHT,
        };
      }

      function startCompositionDrag(event) {
        if (!state.compositionEditor) {
          return;
        }

        const handle = event.target.closest('[data-handle]');
        state.compositionDrag = {
          handle: handle ? handle.dataset.handle : '',
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          startLayout: readCompositionInputs(),
        };

        compositionControl.setPointerCapture(event.pointerId);
        window.addEventListener('pointermove', moveCompositionDrag);
        window.addEventListener('pointerup', stopCompositionDrag);
        event.preventDefault();
      }

      function moveCompositionDrag(event) {
        const drag = state.compositionDrag;

        if (!drag) {
          return;
        }

        const scale = getCompositionScale();
        const dx = (event.clientX - drag.startX) / scale.x;
        const dy = (event.clientY - drag.startY) / scale.y;
        const next = resizeComposition(drag.startLayout, drag.handle, dx, dy);

        applyCompositionToInputs(next);
      }

      function stopCompositionDrag(event) {
        if (state.compositionDrag && state.compositionDrag.pointerId === event.pointerId) {
          try {
            compositionControl.releasePointerCapture(event.pointerId);
          } catch (error) {
            // Pointer capture may already be released by the browser.
          }
        }

        state.compositionDrag = null;
        window.removeEventListener('pointermove', moveCompositionDrag);
        window.removeEventListener('pointerup', stopCompositionDrag);
      }

      function resizeComposition(layout, handle, dx, dy) {
        const next = { ...layout };

        if (!handle) {
          next.imageLeft = layout.imageLeft + dx;
          next.imageTop = layout.imageTop + dy;
          return normalizeComposition(next);
        }

        const right = layout.imageLeft + layout.imageWidth;
        const bottom = layout.imageTop + layout.imageHeight;
        const centerX = layout.imageLeft + layout.imageWidth / 2;
        const centerY = layout.imageTop + layout.imageHeight / 2;
        const isEast = handle.includes('e');
        const isWest = handle.includes('w');
        const isSouth = handle.includes('s');
        const isNorth = handle.includes('n');
        const horizontalDelta = isEast ? dx : isWest ? -dx : 0;
        const verticalDelta = isSouth ? dy : isNorth ? -dy : 0;
        const widthFromHorizontal = layout.imageWidth + horizontalDelta;
        const heightFromVertical = layout.imageHeight + verticalDelta;
        const horizontalScale = Math.abs(horizontalDelta / layout.imageWidth);
        const verticalScale = Math.abs(verticalDelta / layout.imageHeight);

        if ((isEast || isWest) && (!isNorth && !isSouth || horizontalScale >= verticalScale)) {
          next.imageWidth = widthFromHorizontal;
          next.imageHeight = Math.round(widthFromHorizontal / SUBJECT_ASPECT_RATIO);
        } else {
          next.imageHeight = heightFromVertical;
          next.imageWidth = Math.round(heightFromVertical * SUBJECT_ASPECT_RATIO);
        }

        if (isEast && !isWest) {
          next.imageLeft = layout.imageLeft;
        } else if (isWest && !isEast) {
          next.imageLeft = right - next.imageWidth;
        } else {
          next.imageLeft = centerX - next.imageWidth / 2;
        }

        if (isSouth && !isNorth) {
          next.imageTop = layout.imageTop;
        } else if (isNorth && !isSouth) {
          next.imageTop = bottom - next.imageHeight;
        } else {
          next.imageTop = centerY - next.imageHeight / 2;
        }

        if (handle === 'e' || handle === 'w') {
          next.imageTop = centerY - next.imageHeight / 2;
        }

        if (handle === 'n' || handle === 's') {
          next.imageLeft = centerX - next.imageWidth / 2;
        }

        return normalizeComposition(next, Math.abs(verticalDelta) > Math.abs(horizontalDelta) ? 'height' : 'width');
      }

      function openStickerZoom(sticker) {
        if (!sticker || !sticker.url) {
          return;
        }

        state.zoomSticker = sticker;
        zoomImage.src = sticker.url;
        zoomResend.disabled = !sticker.imageId || !sticker.outputId;
        zoomResend.textContent = 'Reenviar WhatsApp';
        zoomModal.classList.remove('hidden');
      }

      function closeStickerZoom() {
        zoomModal.classList.add('hidden');
        zoomImage.removeAttribute('src');
        state.zoomSticker = null;
        zoomResend.disabled = false;
        zoomResend.textContent = 'Reenviar WhatsApp';
      }

      async function resendZoomSticker() {
        const sticker = state.zoomSticker;

        if (!sticker || !sticker.imageId || !sticker.outputId) {
          return;
        }

        zoomResend.disabled = true;
        zoomResend.textContent = 'Reenviando...';

        try {
          await apiPost(
            `/api/photobooth/manager/images/${encodeURIComponent(sticker.imageId)}/stickers/${encodeURIComponent(sticker.outputId)}/resend`,
            {},
          );
          zoomResend.textContent = 'Reenviado';
          setTimeout(() => {
            if (state.zoomSticker === sticker) {
              zoomResend.disabled = false;
              zoomResend.textContent = 'Reenviar WhatsApp';
            }
          }, 1400);
        } catch (error) {
          zoomResend.disabled = false;
          zoomResend.textContent = 'Reenviar WhatsApp';
        }
      }

      async function apiPost(url, body) {
        const token = await state.auth.currentUser.getIdToken();
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            Authorization: `Bearer ${token}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(body),
        });
        const payload = await response.json().catch(() => ({ message: response.statusText }));

        if (!response.ok) {
          alert(payload.message || 'Falha ao executar acao.');
          throw new Error(payload.message || 'Falha ao executar acao.');
        }

        return payload;
      }

      function getMainImageUrl(item) {
        return Object.values(item.outputs || {})
          .find((output) => output.kind === 'main')
          ?.files
          ?.find((file) => file.type === 'print-png')
          ?.signedUrl || '';
      }

      function getMainSubjectUrl(item) {
        return Object.values(item.outputs || {})
          .find((output) => output.kind === 'main')
          ?.files
          ?.find((file) => file.type === 'subject-png')
          ?.signedUrl || '';
      }

      function getImageComposition(item) {
        const mainOutput = Object.values(item.outputs || {})
          .find((output) => output.kind === 'main');

        return item.mainComposition
          || mainOutput?.composition
          || state.mainCompositionDefaults;
      }

      function getStickerItems(item) {
        return Object.values(item.outputs || {})
          .filter((output) => output.kind === 'sticker')
          .map((output) => {
            const file = output.files?.find((item) => item.type === 'webp' && item.signedUrl)
              || output.files?.find((item) => item.signedUrl);

            if (!file) {
              return null;
            }

            return {
              outputId: output.id,
              title: output.title || output.id,
              url: file.signedUrl,
            };
          })
          .filter((item) => item && item.url && item.outputId)
          .slice(0, 10);
      }

      function readNumber(value, fallback) {
        const parsed = Number.parseInt(value, 10);
        return Number.isFinite(parsed) ? parsed : fallback;
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function stopListeners() {
        if (state.eventUnsubscribe) {
          state.eventUnsubscribe();
          state.eventUnsubscribe = null;
        }

        if (state.profileUnsubscribe) {
          state.profileUnsubscribe();
          state.profileUnsubscribe = null;
        }

        if (state.imageUnsubscribe) {
          state.imageUnsubscribe();
          state.imageUnsubscribe = null;
        }

        if (state.printUnsubscribe) {
          state.printUnsubscribe();
          state.printUnsubscribe = null;
        }
      }

      function maskPhone(phone) {
        const text = String(phone || '').replace(/^whatsapp:/, '');

        if (text.length < 9) {
          return text;
        }

        return `${text.slice(0, -8)}****-${text.slice(-4)}`;
      }

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function escapeAttr(value) {
        return String(value || '').replace(/[^a-zA-Z0-9_-]+/g, '-');
      }

      function formatNumber(value) {
        return Number(value || 0).toLocaleString('pt-BR');
      }

      function formatAverageDuration(generation) {
        const count = Number(generation?.completedCount || 0);
        const total = Number(generation?.totalDurationMs || 0);

        if (!count || !total) {
          return '0s';
        }

        return formatDuration(total / count);
      }

      function formatDuration(ms) {
        const totalSeconds = Math.max(0, Math.round(Number(ms || 0) / 1000));
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;

        if (minutes) {
          return `${minutes}m ${String(seconds).padStart(2, '0')}s`;
        }

        return `${seconds}s`;
      }

      function timestampToMillis(value) {
        if (!value) {
          return 0;
        }

        if (typeof value.toMillis === 'function') {
          return value.toMillis();
        }

        if (typeof value.seconds === 'number') {
          return value.seconds * 1000;
        }

        return Number(value) || 0;
      }
    </script>
  </body>
</html>
